<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>QR Label (Demo)</title>
  <link rel="stylesheet" href="css/global.css" />
  <style>
    /* 58mm thermal label look */
    body{background:#0b1220;color:#e5e7eb}
    .labelWrap{max-width:360px;margin:0 auto;padding:18px}
    .labelCard{background:#ffffff;color:#111827;border-radius:14px;padding:14px;border:1px solid rgba(0,0,0,.08)}
    .small{font-size:12px;opacity:.85}
    .qrBox{display:flex;justify-content:center;align-items:center;padding:10px 0}
    .qrBox img{width:220px;height:220px}
    .btnRow{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:12px}
    @media print{
      body{background:#fff}
      .labelWrap{padding:0;max-width:100%}
      .btnRow{display:none}
    }
  </style>
</head>
<body>
  <div class="labelWrap">
    <div class="labelCard">
      <div style="display:flex;align-items:center;gap:10px;">
        <img src="assets/logo.png" alt="Logo" style="width:36px;height:36px;filter:none" />
        <div>
          <div style="font-weight:700">Levent MarineTech</div>
          <div class="small">Device QR Label (Demo)</div>
        </div>
      </div>

      <div class="qrBox">
        <img id="qrImg" alt="QR" src="" />
      </div>

      <div class="small" style="text-align:center">
        Scan to open report
      </div>

      <div class="small" style="margin-top:10px">
        Report ID: <b id="rid"></b>
      </div>
    </div>

    <div class="btnRow">
      <button class="btnPrimary" onclick="window.print()">Print</button>
      <a class="btnGhost" href="authorized.html">Back</a>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(location.search);
    const id = params.get('id') || '';
    document.getElementById('rid').textContent = id;

    // Demo uses demo-report to keep the flow working without backend records
    const targetUrl = `${location.origin}${location.pathname.replace(/\/[^\/]*$/, '/')}` + `demo-report.html?id=${encodeURIComponent(id)}`;

    // Free QR image generator
    const qr = `https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=${encodeURIComponent(targetUrl)}`;
    document.getElementById('qrImg').src = qr;
  </script>
</body>
</html>
