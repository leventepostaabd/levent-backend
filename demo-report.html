<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Demo Report | Levent MarineTech</title>
  <link rel="icon" href="assets/logo.png" />
  <link rel="stylesheet" href="css/global.css" />
  <link rel="stylesheet" href="css/authorized.css" />
  <style>
    .demoWrap{padding-top:110px}
    .reportBox{background:rgba(15,23,42,0.9);backdrop-filter:blur(18px);border-radius:22px;border:1px solid rgba(255,255,255,0.12);padding:22px;box-shadow:0 20px 60px rgba(0,0,0,0.45)}
    .reportHeader{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}
    .pill{display:inline-block;padding:6px 10px;border-radius:999px;border:1px solid rgba(255,255,255,0.14);font-size:12px;opacity:.9}
    .meta{font-size:13px;opacity:.8;margin-top:6px}
    .btnRow{display:flex;gap:10px;flex-wrap:wrap}
    .reportBody{margin-top:16px}
    .reportBody ul{margin:8px 0 0;padding-left:18px;line-height:1.8}
  </style>
</head>
<body>

  <!-- HEADER (same structure) -->
  <div class="header">
    <div class="container headerInner">
      <a class="brand" href="index.html">
        <img src="assets/logo.png" alt="Levent logo" />
        <div>
          <div class="name" data-i18n="brand_name">Levent Marine Electro-Technical Services LLC</div>
          <span class="tag" data-i18n="brand_tag">leventmarinetech.com</span>
        </div>
      </a>

      <div class="nav">
        <a href="index.html#services" data-i18n="nav_services">Services</a>
        <a href="index.html#certification" data-i18n="nav_certification">Testing & Certification</a>
        <a href="profile.html" data-i18n="nav_about">About</a>
        <a href="index.html#contact" data-i18n="nav_contact">Contact</a>
        <button class="lang" id="btnLangEn">🇺🇸 EN</button>
        <button class="lang" id="btnLangTr">🇹🇷 TR</button>
      </div>
    </div>
  </div>

  <div class="container demoWrap">
    <div class="reportBox">
      <div class="reportHeader">
        <div>
          <span class="pill" data-i18n="demo_page_badge">DEMO</span>
          <h2 id="rTitle" style="margin:10px 0 2px;">DEMO-ACB-001</h2>
          <div id="rMeta" class="meta"></div>
        </div>
        <div class="btnRow">
          <button class="btnPrimary" id="btnPrint" type="button" data-i18n="demo_report_print">Yazdır</button>
          <a class="btnGhost" href="demo.html" data-i18n="demo_report_back">Demo'ya Dön</a>
        </div>
      </div>

      <div class="reportBody">
        <h3 style="margin:0" data-i18n="demo_report_summary">Özet</h3>
        <ul id="rList"></ul>
        <p id="rDisclaimer" style="margin-top:12px;opacity:.75" data-i18n="demo_report_disclaimer">
          Bu rapor, sadece sistemi tanıtmak için hazırlanmış demo verisidir.
        </p>
      </div>
    </div>
  </div>

  <footer class="footer">© 2026 Levent Marine Electro Technical Services.</footer>

  <script src="js/global.js"></script>
  <script src="js/global.js"></script>
  <script>
    const demoData = {
      "DEMO-ACB-001": {
        vessel: "MV North Aurora",
        service: "ACB Injection / Trip Test",
        date: "2026-01-05",
        details: [
          "Breaker: ACB Main Switchboard Incomer",
          "Test: Long-time / Short-time / Instantaneous verification",
          "Result: PASS",
          "Notes: Settings verified and sealed after test."
        ]
      },
      "DEMO-IR-014": {
        vessel: "MV North Horizon",
        service: "Insulation Resistance (LV)",
        date: "2026-01-09",
        details: [
          "Circuit: Lighting feeder group",
          "Instrument: 500V insulation tester",
          "Result: PASS",
          "Notes: Readings stable; drying not required."
        ]
      },
      "DEMO-PM-022": {
        vessel: "MV North Vega",
        service: "Preventive Maintenance Summary",
        date: "2026-01-12",
        details: [
          "Scope: PMS electrical checks",
          "Tasks: Termination torque check, visual inspection, hotspot scan review",
          "Result: PASS",
          "Notes: No abnormal heating detected."
        ]
      }
    };

    const id = new URLSearchParams(location.search).get("id") || "DEMO-ACB-001";
    const rec = demoData[id] || demoData["DEMO-ACB-001"];

    document.getElementById("rTitle").textContent = `${id} — ${rec.service}`;
    document.getElementById("rMeta").textContent = `${rec.vessel} • ${rec.date}`;

    const ul = document.getElementById("rList");
    ul.innerHTML = rec.details.map(x => `<li>${x}</li>`).join("");

    document.getElementById("btnPrint").addEventListener("click", () => window.print());
  </script>
</body>
</html>
